[platformio]
# Production is the default, but `run` still only builds unless upload is named.
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
# M5Stack documents StickS3 through the generic DevKitC definition plus its
# 8 MB flash, octal PSRAM, and board-detection flags.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_unflags =
  -std=gnu++11
  # PlatformIO's DevKitC default selects hardware USB-JTAG CDC. Composite HID
  # needs native TinyUSB device mode instead.
  -DARDUINO_USB_MODE=1
build_flags =
  -std=gnu++17
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=3
  # BLE is a one-peer peripheral only. These NimBLE-Arduino configuration
  # flags remove the unused scan/initiate roles and bound persistent state.
  # Secure Connections stay enabled per connection (setSecurityAuth sc=true);
  # SC-ONLY is deliberately absent: it demands an authenticated (MITM) pairing,
  # which a no-input/no-output Just-Works mouse can never produce, so every
  # encrypted HID attribute would be refused with Insufficient Authentication.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
  # NimBLE runs its C++ wrapper logging (INFO at CORE_DEBUG_LEVEL=3) and our
  # server callbacks on the host task; 4 KB is the library default, 8 KB is
  # cheap insurance against a stack overflow there (REVIEW-r2 answer 2).
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
lib_deps =
  m5stack/M5Unified@0.2.19
  m5stack/M5GFX@0.2.26
  h2zero/NimBLE-Arduino@2.5.1
extra_scripts =
  pre:scripts/build_id.py
  # Post-link image gates: rollback hook really overridden, reset-reason and
  # crash breadcrumb linked, true internal-DRAM budget (incl. the IRAM shadow).
  post:scripts/check_image.py
monitor_speed = 115200
# Symbolize panic backtraces against the current build when a UART0/JTAG
# console is attached; no effect on the image.
monitor_filters = esp32_exception_decoder

[env:m5stack-sticks3-noble]
# Instrumentation-only variant for the OTA safety-net proof (PLAN-r2 Step B):
# the same image minus the BLE bring-up call. build_id.py suffixes the build
# id with "-noble" so the greeting/STATUS never impersonate the BLE build.
extends = env:m5stack-sticks3
build_flags =
  ${env:m5stack-sticks3.build_flags}
  -DCOLIBRINO_BLE_ENABLED=0

[env:native]
# Fast host-side tests compile only allocation-free portable production modules.
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  +<boot_health.cpp>
  +<imu_blink_detector.cpp>
  +<mouse_output_policy.cpp>
  +<motion_controller.cpp>
  +<signal_analysis.cpp>
build_flags =
  -std=gnu++17
  -Iinclude

[env:wokwi-esp32s3]
# Generic ESP32-S3 execution gate. Board-specific main/IR sources are excluded
# because Wokwi does not provide a complete StickS3 peripheral model.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DCOLIBRINO_WOKWI=1
build_src_filter =
  +<boot_health.cpp>
  +<imu_blink_detector.cpp>
  +<mouse_output_policy.cpp>
  +<motion_controller.cpp>
  +<signal_analysis.cpp>
  +<sim_main.cpp>
monitor_speed = 115200
